x-n8n-environment: &n8n-environment
  DB_TYPE: postgresdb
  DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
  EXECUTIONS_PROCESS: ${EXECUTIONS_PROCESS:-main}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
  N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
  N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
  QUEUE_BULL_REDIS_PORT: ${QUEUE_BULL_REDIS_PORT:-6379}

x-n8n-common: &n8n-common
  image: n8nio/n8n:latest
  restart: always
  ports:
    - "${N8N_PORT_HOST:-5678}:5678"
  volumes:
    - n8n_data:/home/node/.n8n
  networks:
    - n8n_network

services:
  n8n:
    <<: *n8n-common
    profiles: [container]
    environment:
      <<: *n8n-environment
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  n8n-host:
    <<: *n8n-common
    profiles: [host]
    environment:
      <<: *n8n-environment
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-host.docker.internal}
      DB_POSTGRESDB_DATABASE: ${DB_POSTGRESDB_DATABASE:-n8n}
      DB_POSTGRESDB_USER: ${DB_POSTGRESDB_USER}
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD}
      QUEUE_BULL_REDIS_HOST: ${QUEUE_BULL_REDIS_HOST:-host.docker.internal}

  postgres:
    profiles: [container]
    image: postgres:13
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network

  redis:
    profiles: [container]
    image: redis:6-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - n8n_network

volumes:
  n8n_data:
  postgres_data:
  redis_data:

networks:
  n8n_network:
